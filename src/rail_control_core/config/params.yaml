# =============================================================
#  관제 코어 파라미터 — 토폴로지 명세서 v3.1 §7 과 동기화
#  한쪽만 고치지 마세요. 값을 바꾸면 회귀 기준값(§6-2 / test/test_regression.py)
#  을 재측정한 뒤 명세서·테스트를 함께 갱신해야 합니다.
# =============================================================

# ---------- ROS 노드 자체 설정 ----------
control_core_node:
  ros__parameters:
    mode: "B"            # A=선착순(FCFS) / B=선점형(PEDD)
    rate_hz: 30.0        # 틱·발행 주기(Hz). 엔진 DT(1/30)와 같아야 실시간 재생
    speed_scale: 1.0     # 배속 — 타이머 1주기당 엔진 틱 수 (D 담당자 UI에서 조절)
    autostart: true      # 기동과 동시에 시나리오 진행 (false 면 /sim_start 필요)

# ---------- 엔진 파라미터 (scenario.PARAMS 를 덮어씀) ----------
# 키 이름은 engine.py 가 읽는 이름과 정확히 일치해야 합니다.
engine:
  speed_default: 1.5     # m/s — 일반 구간
  speed_shaft: 1.0       # m/s — 수직 쉬프트(SB-*)
  pitch: 0.9             # m — 캡슐 점유 피치 (길이 0.6 + 안전간격 0.3) [가정]
  yield_window_sec: 15.0 # P0 선점 잠금 파도(bow-wave) 폭
  unload_sec: 2.0        # 목적지 하역 소요
  stall_timeout_sec: 20.0  # 전역 무진행 이 시간 초과 시 DEADLOCK 이벤트 1회 발행
  priority_due_sec:      # EDD 마감 = 발령시각 + 이 값
    0: 60                # P0 (Code Crimson)
    1: 180               # P1
    2: 600               # P2
    3: 1800              # P3

# ---------- 참고: 명세서 §7 의 나머지 항목 (현재 코드가 읽지 않는 문서값) ----------
# 토폴로지 상수(블록 길이·용량)는 rail_control_core/topology.py 에 하드코딩되어
# 있습니다. B 담당자의 씬 좌표 확정 시 topology.py 의 숫자를 고치고
# 회귀 기준값을 재측정하세요.
reference:
  capsule: { count: 10, length_m: 0.6, gap_m: 0.3 }
  convoy: { size: 4, headway_rule: "block" }
  depot: { dock_count: 10 }
  queue: { blood_bank_capacity: 4, launch_ramp_bb09_capacity: 4 }  # v3.1
  placement: { queue_standby: 4, depot_idle: 6 }
  sim: { tick_rate_hz: 30, accel_limit: 0.8 }
  p0_codename: "CODE_CRIMSON"

# ---------- 회귀 기준값 (명세서 §6-2, 2026-08-21 측정) ----------
baseline:
  mode_a_makespan_s: 46.90
  mode_b_p0_arrive_s: 41.47
  tolerance_s: 0.2
