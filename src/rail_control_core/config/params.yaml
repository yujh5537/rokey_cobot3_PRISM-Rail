# =============================================================
#  관제 코어 파라미터 (A. 관제 코어 1일차 산출물)
#  ROS2 노드에서는 control_core_node 아래 ros__parameters 로 읽힙니다.
# =============================================================
control_core_node:
  ros__parameters:

    # ---------- 모드 스위치 (4일차 과제: 모드 A/B 전환 파라미터화) ----------
    # A = 선착순(FCFS), 선점 없음  →  "기존 방식" 비교군
    # B = P-EDD 정렬 + 계단식 선점 →  "우리 방식"
    mode: "B"

    # ---------- 시간 파라미터 ----------
    tick_s: 0.1            # 시뮬레이션 1스텝 = 0.1초
    speed_scale: 1.0       # 배속 (D 담당자 UI에서 조절)
    load_s: 1.0            # 적재 소요시간
    handover_s: 2.0        # 하역·인계 소요시간
    return_s: 2.0          # 공 캡슐 회송 처리시간

    # ---------- 선점 규칙 파라미터 ----------
    # 이미 블록에 진입한 캡슐의 잔여 통과시간이 이 값 이하면 "완주 허용",
    # 초과하면 대피/양보를 검토합니다. (레일은 역주행 불가!)
    runthrough_threshold_s: 7.5

    # 선점 대상 캡슐과 선점하는 캡슐의 등급 차이가 이 값 이상일 때만 대피 명령
    evacuate_min_gap: 1

    # ---------- 회귀 테스트 기준 (2일차 과제) ----------
    # ⚠️ 기준 KPI는 아직 팀 미확정 상태입니다.
    #    아래 baseline_kpi 값만 바꾸면 회귀 테스트가 그 지표를 기준으로 돕니다.
    #    선택지: p0_finish_s | p0_lead_time_s | makespan_s | avg_lead_time_s
    baseline_kpi: "p0_finish_s"
    baseline_mode_a: 53.9
    baseline_mode_b: 44.7
    baseline_tolerance: 0.5

    # 참고: 발표자료에 적힌 54.3 / 44.2 는 무엇의 시간인지 명시가 없었습니다.
    #       p0_finish_s 로 해석했을 때만 0.5초 이내로 일치합니다.
    #       팀 확정 후 baseline_kpi 를 바꾸고 tools/kpi_report.py 값으로 갱신하세요.

    # ---------- 발행 주기 ----------
    publish_hz: 10.0
