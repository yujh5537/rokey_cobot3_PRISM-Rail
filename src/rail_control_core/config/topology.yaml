# =============================================================
#  의료 레일 관제 디지털 트윈 — 토폴로지 명세 (A. 관제 코어)
#  10 노드 / 8 블록 / 1 대피지선
#  ※ 이 파일이 A 담당자의 1일차 산출물 "토폴로지 명세서"의 실체입니다.
#     B(씬 빌더)와 C(연동)는 이 파일의 node_id / block_id를 그대로 씁니다.
# =============================================================

meta:
  version: "1.0.0"      # 바꿀 때마다 올리기. 팀원에게 공유되는 계약(Contract)입니다.
  author: "A. 관제 코어"

# ---------- 노드 (정차 가능한 지점) ----------
# type: station(적재/하역 가능) | junction(합류·분기) | shaft(수직 쉬프트) | siding(대피 지선)
nodes:
  N1: { name: "혈액은행",      floor: "B1F", type: station }
  N2: { name: "약제부",        floor: "B1F", type: station }
  N3: { name: "주사조제실",    floor: "B1F", type: station }
  J1: { name: "B1F 합류점",    floor: "B1F", type: junction }
  S1: { name: "수직 쉬프트",   floor: "SHAFT", type: shaft }
  J2: { name: "2F 분기점",     floor: "2F",  type: junction }
  N4: { name: "수술장",        floor: "2F",  type: station }
  N5: { name: "ICU",           floor: "2F",  type: station }
  N6: { name: "CSR 세척구역",  floor: "2F",  type: station }
  E1: { name: "대피 지선",     floor: "2F",  type: siding }

# ---------- 블록 (구간 = 상호배제 자원) ----------
# 한 블록에는 동시에 캡슐 1대만 들어갑니다. 이것이 폐색(Block) 제어의 핵심입니다.
# traverse_s : 이 블록을 끝까지 통과하는 데 걸리는 시간(초)
# bottleneck : 병목 구간 표시 (시각화·로그용)
# forbid     : 이 블록에 들어갈 수 없는 화물 종류 (청결/오염 동선 분리)
blocks:
  B01: { from: N1, to: J1, via: [],   traverse_s: 2.0,  bottleneck: false }
  B02: { from: N2, to: J1, via: [],   traverse_s: 2.0,  bottleneck: false }
  B03: { from: N3, to: J1, via: [],   traverse_s: 8.5, bottleneck: false }
  # 수직 쉬프트: 단선 + 중간 이탈 불가 → 한 번 들어가면 무조건 완주해야 합니다.
  B04: { from: J1, to: J2, via: [S1], traverse_s: 9.5,  bottleneck: true,  allow_evacuate: false }
  B05: { from: J2, to: N4, via: [],   traverse_s: 8.0,  bottleneck: true  }  # 병목 ② 수술장 인입
  B06: { from: J2, to: N5, via: [],   traverse_s: 6.5,  bottleneck: false }
  B07: { from: J2, to: N6, via: [],   traverse_s: 5.0,  bottleneck: false, forbid: [clean] }   # 오염 회수 전용
  B08: { from: J2, to: E1, via: [],   traverse_s: 3.0,  bottleneck: false }  # 대피 지선(Siding)

# ---------- 대피 지선 매핑 ----------
# "이 노드에서 대피 명령을 받으면 어느 지선으로 빠지는가"
sidings:
  J2: E1
