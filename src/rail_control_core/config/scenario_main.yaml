# =============================================================
#  ⚠️ 폐기됨 (DEPRECATED) — 이 파일은 더 이상 코드가 읽지 않습니다.
#
#  토폴로지 v3.1 부터 블록/경로 정의는 파이썬 모듈로 이동했습니다:
#     토폴로지  → rail_control_core/topology.py  (BLOCKS / CORRIDORS / ROUTES)
#     시나리오  → rail_control_core/scenario.py  (ORDER_DEFS / PARAMS)
#     파라미터  → config/params.yaml 의 engine 블록
#
#  아래 내용은 v1 시절(10노드·8블록) 값이라 현재 도면(30블록)과 다릅니다.
#  B(씬 빌더)·C(연동)는 이 파일이 아니라 topology.py 의 ID를 쓰세요.
#  이력 참고용으로만 남겨 둡니다 — 팀 합의 후 삭제 예정.
# =============================================================

# =============================================================
#  메인 시나리오 — "동시다발 오더와 계단식 선점"
#  2차 발표 타임라인 표를 그대로 데이터로 옮긴 것입니다.
# =============================================================
orders:
  - id: "O-1"
    priority: 3                 # P3 정기·배치
    item: "오염 기구 회수"
    cargo_class: dirty          # 오염 → 청결 전용 블록 진입 금지
    origin: N4                  # 수술장
    dest:   N6                  # CSR 세척구역
    release_s: 0.0              # T+0s 발생
    due_s: 120.0                # 마감시각(여유 큼)
    load_s: 19.5                # 오염 기구 밀봉·소독 준비에 오래 걸림(P3 배치 특성)

  - id: "O-2"
    priority: 2                 # P2 준긴급
    item: "항암제·TPN 조제약"
    cargo_class: clean
    origin: N3                  # 주사조제실
    dest:   N5                  # ICU
    release_s: 5.0              # T+5s
    due_s: 60.0                 # 조제 후 안정성 시한 → 지연 비용 계산의 기준

  - id: "O-3"
    priority: 1                 # P1 긴급
    item: "응급약품"
    cargo_class: clean
    origin: N2                  # 약제부
    dest:   N5                  # ICU
    release_s: 12.0             # T+12s
    due_s: 45.0

  - id: "O-4"
    priority: 0                 # P0 최우선 (Code Red)
    item: "응급 수혈혈액"
    cargo_class: clean
    origin: N1                  # 혈액은행
    dest:   N4                  # 수술장
    release_s: 20.0             # T+20s
    due_s: 45.0
    code_red: true
