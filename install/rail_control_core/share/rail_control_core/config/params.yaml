# =============================================================
#  관제 코어 파라미터 (A. 관제 코어 1일차 산출물)
#  ROS2 노드에서는 control_core_node 아래 ros__parameters 로 읽힙니다.
# =============================================================
control_core_node:
  ros__parameters:

    # ---------- 모드 스위치 (4일차 과제: 모드 A/B 전환 파라미터화) ----------
    # A = 선착순(FCFS), 선점 없음  →  "기존 방식" 비교군
    # B = P-EDD 정렬 + 계단식 선점 →  "우리 방식"
    mode: "B"

    # ---------- 시간 파라미터 ----------
    tick_s: 0.1            # 시뮬레이션 1스텝 = 0.1초
    speed_scale: 1.0       # 배속 (D 담당자 UI에서 조절)
    load_s: 1.0            # 적재 소요시간
    handover_s: 2.0        # 하역·인계 소요시간
    return_s: 2.0          # 공 캡슐 회송 처리시간

    # ---------- 선점 규칙 파라미터 ----------
    # 이미 블록에 진입한 캡슐의 잔여 통과시간이 이 값 이하면 "완주 허용",
    # 초과하면 대피/양보를 검토합니다. (레일은 역주행 불가!)
    runthrough_threshold_s: 7.5

    # 선점 대상 캡슐과 선점하는 캡슐의 등급 차이가 이 값 이상일 때만 대피 명령
    evacuate_min_gap: 1

    # ---------- 회귀 테스트 기준값 (2일차 과제) ----------
    # 발표자료 기준값. 코드를 고친 뒤에도 이 값이 유지되어야 "회귀 없음".
    baseline_mode_a_s: 54.3
    baseline_mode_b_s: 44.2
    baseline_tolerance_s: 0.5

    # ---------- 발행 주기 ----------
    publish_hz: 10.0
